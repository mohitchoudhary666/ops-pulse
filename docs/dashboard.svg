<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">OpsPulse local host observability dashboard</title>
  <desc id="desc">Dark monitoring interface with CPU, memory, storage, resource trend, health signals, recent errors, and a troubleshooting panel.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#0b1020"/></linearGradient><linearGradient id="cyan" x2="1"><stop stop-color="#44d7e8"/><stop offset="1" stop-color="#a691ff"/></linearGradient></defs>
  <rect width="1200" height="690" rx="20" fill="url(#bg)"/><rect x="26" y="24" width="1148" height="642" rx="18" fill="#0e1727" stroke="#24334b"/>
  <rect x="48" y="48" width="36" height="36" rx="12" fill="#11283a" stroke="#2a5367"/><text x="60" y="73" fill="#44d7e8" font-family="Arial" font-size="24">⌁</text><text x="96" y="64" fill="#edf3ff" font-family="Arial" font-size="17" font-weight="700">OpsPulse</text><text x="96" y="81" fill="#92a4be" font-family="Arial" font-size="11">Local host observability</text><circle cx="1073" cy="65" r="4" fill="#52e0a1"/><text x="1085" y="69" fill="#92a4be" font-family="Arial" font-size="11">LIVE</text>
  <text x="50" y="125" fill="#44d7e8" font-family="Arial" font-size="10" font-weight="700" letter-spacing="2">INFRASTRUCTURE OVERVIEW</text><text x="50" y="158" fill="#edf3ff" font-family="Arial" font-size="27" font-weight="700">System health, at a glance.</text><text x="50" y="179" fill="#92a4be" font-family="Arial" font-size="12">Live resource telemetry and actionable signals from this Linux host.</text>
  <g font-family="Arial"><g><rect x="48" y="202" width="267" height="116" rx="14" fill="#131f32" stroke="#24334b"/><text x="68" y="230" fill="#92a4be" font-size="11">CPU LOAD</text><text x="68" y="270" fill="#edf3ff" font-size="32" font-weight="700">24%</text><text x="68" y="291" fill="#92a4be" font-size="11">8 logical cores</text><rect x="68" y="301" width="224" height="4" rx="2" fill="#24334b"/><rect x="68" y="301" width="54" height="4" rx="2" fill="url(#cyan)"/></g>
  <g><rect x="329" y="202" width="267" height="116" rx="14" fill="#131f32" stroke="#24334b"/><text x="349" y="230" fill="#92a4be" font-size="11">MEMORY</text><text x="349" y="270" fill="#edf3ff" font-size="32" font-weight="700">61%</text><text x="349" y="291" fill="#92a4be" font-size="11">4.8 GB used · 3.1 GB available</text><rect x="349" y="301" width="224" height="4" rx="2" fill="#24334b"/><rect x="349" y="301" width="137" height="4" rx="2" fill="url(#cyan)"/></g>
  <g><rect x="610" y="202" width="267" height="116" rx="14" fill="#131f32" stroke="#24334b"/><text x="630" y="230" fill="#92a4be" font-size="11">ROOT DISK</text><text x="630" y="270" fill="#edf3ff" font-size="32" font-weight="700">48%</text><text x="630" y="291" fill="#92a4be" font-size="11">/ · 36 GB free</text><rect x="630" y="301" width="224" height="4" rx="2" fill="#24334b"/><rect x="630" y="301" width="108" height="4" rx="2" fill="url(#cyan)"/></g>
  <g><rect x="891" y="202" width="259" height="116" rx="14" fill="#131f32" stroke="#24334b"/><text x="911" y="230" fill="#92a4be" font-size="11">UPTIME</text><text x="911" y="270" fill="#edf3ff" font-size="32" font-weight="700">12d 4h</text><text x="911" y="291" fill="#92a4be" font-size="11">Since last boot</text><rect x="911" y="297" width="93" height="17" rx="8" fill="#183629"/><text x="923" y="309" fill="#52e0a1" font-size="9">GPU NVIDIA · 18%</text></g></g>
  <rect x="48" y="334" width="732" height="190" rx="14" fill="#131f32" stroke="#24334b"/><text x="68" y="363" fill="#edf3ff" font-family="Arial" font-size="14" font-weight="700">Resource trends</text><text x="68" y="381" fill="#92a4be" font-family="Arial" font-size="10">Rolling samples · 5 second interval</text><text x="708" y="363" fill="#92a4be" font-family="Arial" font-size="10">● CPU</text><text x="746" y="363" fill="#a691ff" font-family="Arial" font-size="10">● RAM</text><g stroke="#24334b"><path d="M100 408H750M100 443H750M100 478H750"/></g><path d="M100 461 C155 456 166 442 214 449 S290 470 344 440 S427 456 475 430 S555 445 600 420 S684 439 750 414" fill="none" stroke="#44d7e8" stroke-width="2.5"/><path d="M100 442 C161 434 178 431 214 435 S286 423 344 427 S423 418 475 421 S551 408 600 413 S681 401 750 405" fill="none" stroke="#a691ff" stroke-width="2.5"/>
  <rect x="794" y="334" width="356" height="190" rx="14" fill="#131f32" stroke="#24334b"/><text x="814" y="363" fill="#edf3ff" font-family="Arial" font-size="14" font-weight="700">Signals &amp; alerts</text><rect x="1063" y="347" width="68" height="22" rx="11" fill="#183629"/><text x="1075" y="362" fill="#52e0a1" font-family="Arial" font-size="9">HEALTHY</text><rect x="814" y="382" width="316" height="36" rx="8" fill="#14271f" stroke="#254c39"/><text x="827" y="405" fill="#a9eaca" font-family="Arial" font-size="11">✓ No threshold alerts. Host signals look healthy.</text><rect x="814" y="430" width="123" height="23" rx="12" fill="#142235" stroke="#24334b"/><text x="827" y="445" fill="#c1d0e5" font-family="Arial" font-size="9">0 failed services</text><rect x="945" y="430" width="130" height="23" rx="12" fill="#142235" stroke="#24334b"/><text x="958" y="445" fill="#c1d0e5" font-family="Arial" font-size="9">0 recent errors</text>
  <rect x="48" y="540" width="547" height="104" rx="14" fill="#131f32" stroke="#24334b"/><text x="68" y="568" fill="#edf3ff" font-family="Arial" font-size="14" font-weight="700">Recent error events</text><text x="68" y="595" fill="#92a4be" font-family="Arial" font-size="11">✓ No recent error-level journal events found.</text><text x="68" y="619" fill="#71839e" font-family="Arial" font-size="9">Journal · last 10 minutes · secrets redacted</text>
  <rect x="610" y="540" width="540" height="104" rx="14" fill="#131f32" stroke="#24334b"/><rect x="630" y="554" width="28" height="28" rx="9" fill="#211e3b"/><text x="638" y="573" fill="#a691ff" font-family="Arial" font-size="14">✳</text><text x="670" y="566" fill="#edf3ff" font-family="Arial" font-size="13" font-weight="700">Ops triage</text><text x="670" y="580" fill="#92a4be" font-family="Arial" font-size="9">Guided, read-only runbook hints</text><rect x="630" y="592" width="500" height="35" rx="10" fill="#1a273c"/><text x="645" y="614" fill="#d6e3f6" font-family="Arial" font-size="10">Need help? Ask about CPU, memory, disk, GPU, or a failed service.</text><text x="48" y="660" fill="#71839e" font-family="Arial" font-size="9">OpsPulse runs locally and only reads host telemetry.</text>
</svg>
